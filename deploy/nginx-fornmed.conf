# nginx för Fornmed. Installeras av installera_server.sh till
# /etc/nginx/sites-available/<domän> och symlänkas till sites-enabled.
# certbot --nginx lägger till 443-blocken och omdirigeringen från http.
#
# Mall: installera_server.sh ersätter platshållarna med domänen i
# deploy/server.env. Fem namn: domänen (webbplatsen), www (omdirigering),
# api och mcp (söktjänsten på 127.0.0.1:8424) och stat (Umami på 127.0.0.1:3000).
# Filen ingår på http-nivå, så zonerna och loggformatet nedan står utanför
# alla server-block.

# -----------------------------------------------------------------------------
# Hastighetsbegränsning per IP-adress
# -----------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=fornmed_webb:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=fornmed_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=fornmed_mcp:10m rate=10r/s;
# SPARQL-frågor kan vara tunga; Oxigraph avbryter dem efter 30 sekunder
limit_req_zone $binary_remote_addr zone=fornmed_sparql:10m rate=2r/s;

# En GET mot /sparql utan fråga är en människa som vill ha frågesidan
map "$request_method:$arg_query" $fornmed_sparql_sida {
    "GET:"      1;
    default     0;
}

# -----------------------------------------------------------------------------
# Loggar med anonymiserade IP-adresser
# -----------------------------------------------------------------------------
# Sista IPv4-oktetten nollas innan raden skrivs, så att statistiken aldrig
# lagrar en fullständig besökaradress. En IPv6-adress matchar inte mönstret
# och skrivs som 0.0.0.0, alltså helt anonymiserad. Fältordningen är nginx
# COMBINED, som GoAccess läser.
map $remote_addr $fornmed_ip_anonymiserad {
    ~(?P<ip>\d+\.\d+\.\d+)\.\d+$    $ip.0;
    default                         0.0.0.0;
}

log_format fornmed_anonymiserad
    '$fornmed_ip_anonymiserad - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';

# -----------------------------------------------------------------------------
# __DOMAN__ — webbplatsen
# -----------------------------------------------------------------------------
# Django och Wagtail i gunicorn (fornmed-webb.service). Statiska filer och
# uppladdade bilder serveras av nginx direkt. Wagtails redigering under
# /admin/ nås bara från adresserna i /etc/nginx/fornmed-admin.conf.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAN__;

    access_log /var/log/nginx/fornmed-webb.access.log fornmed_anonymiserad;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json text/markdown text/plain text/csv text/css
               application/javascript image/svg+xml text/turtle application/ld+json
               application/n-triples application/rdf+xml application/sparql-results+json
               application/sparql-results+xml;

    # Umamis spårningsskript och insamling ligger på stat.__DOMAN__
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://stat.__DOMAN__; connect-src 'self' https://stat.__DOMAN__; img-src 'self' data:; style-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;

    # Visas när gunicorn startar om
    error_page 502 503 504 /503.html;
    location = /503.html {
        root /var/www/fornmed;
        internal;
    }

    location /static/ {
        alias /srv/fornmed/webb-static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/fornmed/webb-media/;
        expires 7d;
    }

    # Wagtails redigering använder inbäddade skript och stilar, så den får en
    # egen, mindre sträng innehållspolicy
    location /admin/ {
        include /etc/nginx/fornmed-admin.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://unix:/run/fornmed-webb/fornmed-webb.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # GoAccess-rapporterna, byggda var femte minut av fornmed-goaccess.timer.
    # Lösenordsfilen skapas på servern med
    # `sudo htpasswd -c /etc/nginx/fornmed-statistik.htpasswd <ANVÄNDARE>`.
    location /statistik/ {
        alias /var/www/goaccess-fornmed/;
        index index.html;
        auth_basic "Fornmed — statistik";
        auth_basic_user_file /etc/nginx/fornmed-statistik.htpasswd;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
    }

    # Länkade data: de beständiga URI:erna (https://w3id.org/fornmed/id/… och
    # …/def/ vidarebefordras hit) besvaras av söktjänsten, som skickar en
    # webbläsare vidare till postens sida och ger ett program RDF
    location ~ ^/(id|def|graf)/ {
        limit_req zone=fornmed_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8424;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPARQL-ändpunkten (Oxigraph, fornmed-sparql.service). /sparql tar emot
    # frågor med GET eller POST; utan fråga skickas läsaren till frågesidan
    # under /sparql/, som Oxigraph själv levererar och som skickar sina
    # frågor till /sparql/sparql.
    location = /sparql {
        if ($fornmed_sparql_sida) {
            return 303 /sparql/;
        }
        limit_req zone=fornmed_sparql burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:7878/query;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 40s;
        client_max_body_size 1m;
    }

    # Frågesidan (Yasgui) har inbäddade skript och stilar och får därför en
    # egen, mindre sträng innehållspolicy
    location /sparql/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        limit_req zone=fornmed_sparql burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:7878/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 40s;
        client_max_body_size 1m;
    }

    # Dumpfilerna från rdf_export.py, en gzippad N-Quads-fil per graf.
    # las_in_rdf.sh pekar om rdf/aktuell vid varje leverans.
    location /data/rdf/ {
        alias /srv/fornmed/rdf/aktuell/;
        autoindex on;
        add_header Access-Control-Allow-Origin "*" always;
        expires 1h;
    }

    location / {
        limit_req zone=fornmed_webb burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://unix:/run/fornmed-webb/fornmed-webb.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -----------------------------------------------------------------------------
# www.__DOMAN__ — omdirigering till __DOMAN__
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.__DOMAN__;
    return 301 https://__DOMAN__$request_uri;
}

# -----------------------------------------------------------------------------
# api.__DOMAN__ — REST-API:et
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.__DOMAN__;

    access_log /var/log/nginx/fornmed-api.access.log fornmed_anonymiserad;

    # Komprimering per server-block: Ubuntus nginx.conf sätter redan gzip på
    # http-nivå, och samma direktiv två gånger där stoppar nginx. Ett helt
    # verk som Olaus Magnus är 2,6 MB som JSON och några hundra kB komprimerat.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json text/markdown text/plain text/csv text/css
               application/javascript image/svg+xml;

    # Visas när söktjänsten startar om, t.ex. under en databasinläsning
    error_page 502 503 504 /503.html;
    location = /503.html {
        root /var/www/fornmed;
        internal;
    }

    # MCP-servern nås bara via mcp.__DOMAN__
    location /mcp {
        return 404;
    }

    location / {
        limit_req zone=fornmed_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8424;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ett helt verk kan ta några sekunder att sätta ihop
        proxy_read_timeout 120s;
    }
}

# -----------------------------------------------------------------------------
# mcp.__DOMAN__ — MCP-servern
# -----------------------------------------------------------------------------
# Klienterna ansluter till https://mcp.__DOMAN__ utan sökväg. Tjänsten har
# MCP-servern på /mcp, så roten skrivs om dit; /mcp skickas vidare oskriven.
# Inställningarna är valda för streamable HTTP: ingen buffring och lång
# läs-timeout, eftersom en session kan hålla en begäran öppen länge.
server {
    listen 80;
    listen [::]:80;
    server_name mcp.__DOMAN__;

    access_log /var/log/nginx/fornmed-mcp.access.log fornmed_anonymiserad;

    location = / {
        limit_req zone=fornmed_mcp burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8424/mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1d;
    }

    location = /mcp {
        limit_req zone=fornmed_mcp burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8424;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1d;
    }

    location / {
        return 404;
    }
}

# -----------------------------------------------------------------------------
# stat.__DOMAN__ — Umami
# -----------------------------------------------------------------------------
# Spårningsskriptet och insamlingen är öppna för alla besökare. Resten av
# Umami, med inloggningen, nås bara från adresserna i
# /etc/nginx/fornmed-admin.conf, som installera_server.sh skriver ur
# --admin-ip; utan sådana adresser är inloggningen stängd för alla.
server {
    listen 80;
    listen [::]:80;
    server_name stat.__DOMAN__;

    access_log off;

    location = /script.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1d;
    }

    location = /api/send {
        limit_req zone=fornmed_webb burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        include /etc/nginx/fornmed-admin.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
