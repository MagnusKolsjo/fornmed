# Inställningar för Fornmed på en server med 8 GB minne. Installeras till
# /etc/postgresql/16/main/conf.d/fornmed.conf.
#
# Databasen är cirka 1,7 GB med 455 MB vektorindex; indexen ska få plats i
# delade buffertar och operativsystemets cache. Söktjänstens
# embeddingmodeller tar omkring 2 GB av resten.

listen_addresses = 'localhost'
max_connections = 50
shared_buffers = 1GB
effective_cache_size = 4GB
work_mem = 32MB
# Bygget av HNSW-indexen vid inläsning av en ny kopia går mycket snabbare
# när grafen ryms i minnet
maintenance_work_mem = 1GB
max_parallel_maintenance_workers = 3
random_page_cost = 1.1
