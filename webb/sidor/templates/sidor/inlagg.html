{% extends "base.html" %}
{% load wagtailcore_tags %}
{% block innehall %}
<article class="text">
  <p class="metadata"><time datetime="{{ page.datum|date:'c' }}">{{ page.datum|date:"j F Y" }}</time></p>
  <h1 class="fm-heading">{{ page.title }}</h1>
  {{ page.brodtext|richtext }}
  <p><a href="{% pageurl page.get_parent %}">Alla uppdateringar</a></p>
</article>
{% endblock %}
